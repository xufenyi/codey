name: Codey
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features test-runtime -- -D warnings
      - run: cargo test --locked --features test-runtime
      - run: cargo build --locked --features test-runtime --bins
      - run: python tests/e2e.py
      - run: node --check web/app.js
      - run: cargo build --locked --release --bin codey
      - uses: actions/upload-artifact@v4
        with:
          name: codey-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/codey
            target/release/codey.exe
            README.md
            LICENSE
          if-no-files-found: error
